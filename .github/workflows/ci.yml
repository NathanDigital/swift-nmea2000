name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Ubuntu 26.04 / Swift (pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: scripts/linux-swift build

      - name: Test
        run: scripts/linux-swift test

      - name: Layering
        run: scripts/check-layering

      - name: Lint
        run: scripts/linux-swift format lint --strict --recursive Sources Tests Snippets Package.swift

      - name: Documentation
        run: scripts/linux-swift package generate-documentation --target NMEA2000 --warnings-as-errors
